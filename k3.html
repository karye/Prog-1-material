# K3 – while-loopar

# Vad är poängen med kapitlet?

Att **upprepa kod** – utan att kopiera den tusen gånger:

- En meny som visas om och om igen
- Fråga användaren tills svaret är rätt
- Spel som snurrar tills spelaren vill sluta

Utan loopar skulle programmen bli oändligt långa. Med en loop blir de **korta och smarta**.

---

# while True – kör om och om igen

```python
while True:
    print("Hej igen!")
```

```text
Hej igen!
Hej igen!
Hej igen!
...
```

- `while` = **medan**
- `True` = **alltid sant** – så loopen körs för evigt
- Indrag = koden som upprepas varje varv

.tip[Tryck **Ctrl+C** i Thonny för att stoppa en loop som aldrig slutar.]

---

# break – avsluta loopen

```python
while True:
    print("Hej igen!")
    break
```

```text
Hej igen!
```

- `break` = **bryt** – avslutar loopen direkt
- Utan `break` snurrar loopen för evigt
- Detta program kör alltså bara **en gång**

---

# input i loopen – fråga varje varv

```python
while True:
    svar = input("Vill du fortsätta? ")
    print("Kul att du är med!")
```

```text
Vill du fortsätta? ja
Kul att du är med!
Vill du fortsätta? ja
Kul att du är med!
...
```

- Varje varv frågar programmet på nytt
- Här finns ingen `break` – det frågar för evigt

---

# break på nyckelord

```python
while True:
    svar = input("Skriv 'sluta' för att avsluta: ")
    if svar == "sluta":
        break
    print("Du skrev:", svar)
```

```text
Skriv 'sluta' för att avsluta: hej
Du skrev: hej
Skriv 'sluta' för att avsluta: sluta
```

- Användaren styr när loopen tar slut – genom att skriva **nyckelordet**
- `if` + `break` = stoppknappen i loopen

# Meny – allt tillsammans

```python
while True:
    print("=== Meny ===")
    print("1. Hälsning")
    print("2. Avsluta")
    val = input("Välj: ")
    if val == "1":
        print("Hej på dig!")
    elif val == "2":
        break
    else:
        print("Ogiltigt val")
```

```text
=== Meny ===
1. Hälsning
2. Avsluta
Välj: 1
Hej på dig!
=== Meny ===
1. Hälsning
2. Avsluta
Välj: 2
```

Menyn visas om och om igen – tills användaren väljer **2**.

---

# Vanliga fallgropar

- **Oändlig loop** – glömt `break` → programmet hänger sig (Ctrl+C fixar)
- Koden efter `break` i loopen körs aldrig
- Glömt indrag → koden hamnar utanför loopen
- `break` utanför en loop → felmeddelande

.tip[Kolla alltid: finns det en väg ut ur loopen?]

---

# Provet – vad som testas

1. `while True` + `print` – ingen input
2. `input()` i loopen – ingen `break`
3. `input()` i loopen + svar
4. `break` på nyckelord (t.ex. "sluta")
5. **Meny** med `if` / `elif` / `else` + `break`

Teman: **skolmat, restaurang, spel** – samma prov, olika inramning.

.tip[Träna med träningsfilerna – de är nästan identiska med provet, bara annat tema.]

---

# Sammanfattning

- `while True:` upprepar – tills `break` stoppar
- `break` = avsluta loopen direkt
- `input()` i loopen = fråga om igen varje varv
- Meny = loop + `if` / `elif` / `else` + `break`
