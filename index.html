### Python från noll – ett steg i taget

# Vad är programmering?

Att **ge datorn exakta instruktioner** – steg för steg, i rätt ordning.

Tänk på ett recept:

1. Sätt ugnen på 200°
2. Rör ihop smeten
3. Grädda i 25 minuter

Datorn gör *precis* det du skriver – inte det du menade.

---

# Vad ska vi bygga i kursen?

Program som gör saker på riktigt, från första lektionen:

- Hälsningar som använder **ditt namn**
- Menyer och quiz med **villkor**
- Loopar som **upprepar** tills du säger stopp
- Spel med **slump**
- Egna **funktioner** att återanvända

.tip[Allt du bygger bygger på samma grunder – ett kapitel i taget.]

---

# Python – språket vi lär oss

Python är ett av världens **vanligaste** programmeringsspråk:

- Lättläst – koden ser nästan ut som vanlig engelska
- Används av **YouTube, Netflix, NASA och Instagram**
- Ligger bakom mycket av dagens AI

Här lär du dig grunderna – allt annat bygger vidare på dem.

---

# Thonny – din editor

All kod skrivs i **Thonny** – gratis, och finns på skolans datorer.

1. Skriv koden i det stora fönstret
2. Kör med **F5** eller den gröna knappen
3. Resultatet syns i **Shell** längst ner

.tip[Ser du röd text? Det är ett **felmeddelande** – läs det! Det berättar ofta exakt vad som är fel.]

---

# Din första kod

```python
print("Hej, världen!")
namn = input("Vad heter du? ")
print("Kul att ses,", namn)
```

Skriv in det i Thonny och tryck **F5** – du har skrivit ditt första program!

---

# Kursens upplägg

- **Ett moment i taget** – vi tar ett kapitel, övar, skriver prov, går vidare
- Varje kapitel har **prov** – med samma struktur, olika teman
- Vill du satsa högre? Det finns även **C- och A-nivåprov**
- Inför varje prov finns **träningsuppgifter**

Inget kapitel kräver att du kan mer än du lärt dig – svårigheten växer stegvis.

---

# Kursens kapitel

| Kapitel | Du kan efteråt |
|---|---|
| **K1** – print & input | Skriva ut text och fråga användaren |
| **K2** – villkor | Program som väljer med `if` / `elif` / `else` |
| **K3** – while-loopar | Upprepa tills användaren säger stopp |
| **K4** – listor | Samla flera värden i en lista |
| **K5** – listor & index | Hämta ut enskilda värden ur listan |
| **K6** – for-loopar & slump | Gå igenom listor, slumpa fram val |
| **K7** – funktioner | Bygga egna byggblock med `def` |
| **K8** – problemlösning | Slutprov – allt tillsammans |

---

# Så funkar provet

Varje prov har **5 uppgifter** – från lätt till svårare. Varje uppgift ser ut så här:

- **Uppgift** – vad programmet ska göra
- **Exempel på körning** – exakt så här ska det se ut
- **Facit** – så du kan jämföra och lära dig

.tip[Exempelkörningen är ett kontrakt: matchar ditt program den, är det rätt.]

---

# Så lyckas du

- **Skriv själv** – kopiera inte bara, då fastnar det inte
- **Kör ofta** – små steg, testa hela tiden
- **Läs felmeddelandena** – de pekar på problemet
- **Träna inför provet** med träningsfilerna
- **Fråga** – det finns inga dumma frågor
